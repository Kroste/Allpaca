name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # nötig, damit der Release-Job das Release anlegen darf

# Allpaca ist bewusst Linux-only (Bazzite-Helfer) — es gibt keinen Windows-Job.
# Gebaut werden tar.gz und AppImage für linux-x64.
jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # MinVer braucht die volle Historie inkl. Tags

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: Directory.Packages.props

      # Node 24 (Standardkonvention für alle Projekte)
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Version ermitteln
        id: ver
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "v=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "v=0.0.0-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Test
        run: dotnet test Allpaca.Tests/Allpaca.Tests.csproj -c Release

      - name: Publish (linux-x64, self-contained)
        run: >
          dotnet publish Allpaca/Allpaca.csproj -c Release -r linux-x64 --self-contained
          -o publish/linux

      - name: Tarball packen
        run: tar -czf "Allpaca-${{ steps.ver.outputs.v }}-linux-x64.tar.gz" -C publish/linux .

      - name: AppImage bauen
        run: bash packaging/linux/build-appimage.sh "${{ steps.ver.outputs.v }}" publish/linux

      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: |
            Allpaca-*-linux-x64.tar.gz
            Allpaca-*-x86_64.AppImage
          retention-days: 7

  release:
    needs: [build-linux]
    runs-on: ubuntu-latest
    # Beim manuellen Start (workflow_dispatch ohne Tag) überspringen.
    if: github.ref_type == 'tag'
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist

      - name: GitHub-Release anlegen/aktualisieren
        uses: softprops/action-gh-release@v3
        with:
          files: dist/**/*
          generate_release_notes: true
          fail_on_unmatched_files: true
